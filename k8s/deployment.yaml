apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: flask-app
          image: ghcr.io/vlaszlo92/k8s-pipeline-gyakorlat:e7e7d7edcd98da827bfa4b28ff7dd2b8add0ce0f
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "k8s-dev"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
